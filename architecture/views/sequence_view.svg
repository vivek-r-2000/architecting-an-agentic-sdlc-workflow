<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 900" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#166534"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="40" font-size="20" font-weight="700" fill="#0f172a">AutoSE SDLC Workflow: Sequence Architecture View</text>
  <text x="40" y="62" font-size="12" fill="#64748b">End-to-End Execution Trace: Trigger, 6-Stage Gated Pipeline, Test Loop, Review Loop, Human Decision</text>

  <!-- Lifeline Headers -->
  <!-- Col 1: Maintainer (X=90) -->
  <rect x="25" y="85" width="130" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" filter="url(#shadow)"/>
  <text x="90" y="108" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Maintainer (Human)</text>
  <line x1="90" y1="121" x2="90" y2="860" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Col 2: Orchestrator / Actions (X=230) -->
  <rect x="165" y="85" width="130" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8" filter="url(#shadow)"/>
  <text x="230" y="108" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Orchestrator</text>
  <line x1="230" y1="121" x2="230" y2="860" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Col 3: Stage 1 Requirements (X=370) -->
  <rect x="305" y="85" width="130" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8" filter="url(#shadow)"/>
  <text x="370" y="108" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">1. Requirements</text>
  <line x1="370" y1="121" x2="370" y2="860" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Col 4: Stage 2 Design (X=510) -->
  <rect x="445" y="85" width="130" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8" filter="url(#shadow)"/>
  <text x="510" y="108" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">2. Design</text>
  <line x1="510" y1="121" x2="510" y2="860" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Col 5: Stage 3 Implement (X=650) -->
  <rect x="585" y="85" width="130" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8" filter="url(#shadow)"/>
  <text x="650" y="108" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">3. Implement</text>
  <line x1="650" y1="121" x2="650" y2="860" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Col 6: Stage 4 Test (X=790) -->
  <rect x="725" y="85" width="130" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8" filter="url(#shadow)"/>
  <text x="790" y="108" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">4. Test</text>
  <line x1="790" y1="121" x2="790" y2="860" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Col 7: Stage 5 Release (X=930) -->
  <rect x="865" y="85" width="130" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8" filter="url(#shadow)"/>
  <text x="930" y="108" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">5. Release</text>
  <line x1="930" y1="121" x2="930" y2="860" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Col 8: Stage 6 Reviewer (X=1060) -->
  <rect x="995" y="85" width="130" height="36" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1060" y="108" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">6. Reviewer</text>
  <line x1="1060" y1="121" x2="1060" y2="860" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Sequence Steps -->
  <!-- 1. Trigger -->
  <line x1="90" y1="145" x2="230" y2="145" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="160" y="138" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">1. Add label 'autose' to Issue #42</text>

  <!-- 2. Dispatch S1 -->
  <line x1="230" y1="175" x2="370" y2="175" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="168" font-size="11" fill="#1e293b" text-anchor="middle">Dispatch(Issue Title + Body)</text>

  <rect x="360" y="185" width="20" height="50" rx="3" fill="#e2e8f0"/>
  <text x="390" y="210" font-size="10" fill="#475569">Extract Gherkin ACs</text>

  <line x1="370" y1="240" x2="230" y2="240" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="300" y="233" font-size="11" font-weight="600" fill="#0284c7" text-anchor="middle">spec.md [Gate 1: ACs Testable ✓]</text>

  <!-- 3. Dispatch S2 -->
  <line x1="230" y1="270" x2="510" y2="270" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="370" y="263" font-size="11" fill="#1e293b" text-anchor="middle">Dispatch(spec.md + ARCHITECTURE.md)</text>

  <rect x="500" y="280" width="20" height="50" rx="3" fill="#e2e8f0"/>
  <text x="530" y="305" font-size="10" fill="#475569">Map TinyDB Constraints</text>

  <line x1="510" y1="335" x2="230" y2="335" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="370" y="328" font-size="11" font-weight="600" fill="#0284c7" text-anchor="middle">design.md [Gate 2: Files/Methods Named ✓]</text>

  <!-- 4. Dispatch S3 -->
  <line x1="230" y1="365" x2="650" y2="365" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="358" font-size="11" fill="#1e293b" text-anchor="middle">Dispatch(design.md, branch 'autose/issue-42')</text>

  <rect x="640" y="375" width="20" height="45" rx="3" fill="#e2e8f0"/>
  <text x="670" y="398" font-size="10" fill="#475569">Patch Source Code</text>

  <line x1="650" y1="425" x2="230" y2="425" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="440" y="418" font-size="11" font-weight="600" fill="#0284c7" text-anchor="middle">diff.patch [Gate 3: Build &amp; Syntax ✓]</text>

  <!-- 5. Dispatch S4 (Test Suite Execution + Feedback Loop) -->
  <line x1="230" y1="455" x2="790" y2="455" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="510" y="448" font-size="11" fill="#1e293b" text-anchor="middle">Dispatch(diff.patch + spec.md) -> Run Pytest</text>

  <!-- Test Failure Frame -->
  <rect x="630" y="470" width="310" height="95" rx="5" fill="#fffbeb" stroke="#fcd34d" stroke-dasharray="3,3"/>
  <text x="640" y="488" font-size="10" font-weight="700" fill="#92400e">Test Feedback Loop (Attempt 1 of 3)</text>

  <line x1="790" y1="505" x2="650" y2="505" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-warn)"/>
  <text x="720" y="498" font-size="10" fill="#d97706" text-anchor="middle">1 Failed: TypeError edge-case trace</text>

  <line x1="650" y1="535" x2="790" y2="535" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="720" y="528" font-size="10" fill="#475569" text-anchor="middle">Re-patch with type guard</text>

  <line x1="790" y1="555" x2="230" y2="555" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="510" y="548" font-size="11" font-weight="600" fill="#0284c7" text-anchor="middle">test_report.md [Gate 4: 228 Base + 3 New Pass ✓]</text>

  <!-- 6. Dispatch S5 Release -->
  <line x1="230" y1="585" x2="930" y2="585" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="580" y="578" font-size="11" fill="#1e293b" text-anchor="middle">Dispatch(Push branch &amp; gh pr create)</text>

  <line x1="930" y1="620" x2="230" y2="620" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="580" y="613" font-size="11" font-weight="600" fill="#0284c7" text-anchor="middle">pr.md + PR #43 Opened [Gate 5: CI Green ✓]</text>

  <!-- 7. Dispatch S6 Reviewer (Sandboxed) -->
  <line x1="230" y1="650" x2="1060" y2="650" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="645" y="643" font-size="11" font-weight="600" fill="#0369a1" text-anchor="middle">Dispatch Reviewer: Issue + Diff only (Zero Reasoning History, No Push)</text>

  <!-- Reviewer Round 1 Code Feedback -->
  <rect x="630" y="665" width="450" height="90" rx="5" fill="#f0f9ff" stroke="#7dd3fc" stroke-dasharray="3,3"/>
  <text x="640" y="682" font-size="10" font-weight="700" fill="#0369a1">Review Round 1 (Adversarial Audit)</text>

  <line x1="1060" y1="700" x2="650" y2="700" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-warn)"/>
  <text x="850" y="693" font-size="10" fill="#d97706" text-anchor="middle">REQUEST_CHANGES: Missing docstring / formatting check</text>

  <line x1="650" y1="730" x2="1060" y2="730" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="850" y="723" font-size="10" fill="#475569" text-anchor="middle">Commit formatted patch &amp; update PR</text>

  <line x1="1060" y1="765" x2="230" y2="765" stroke="#166534" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="645" y="758" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">review.md: APPROVE [Gate 6: Verified Valid &amp; Safe]</text>

  <!-- 8. Human Final Decision -->
  <line x1="230" y1="805" x2="90" y2="805" stroke="#166534" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="160" y="798" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">Notify Maintainer: PR #43 Ready</text>

  <rect x="40" y="820" width="100" height="35" rx="5" fill="#f0fdf4" stroke="#86efac"/>
  <text x="90" y="842" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">Human Merges</text>
</svg>
